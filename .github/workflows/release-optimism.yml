name: Docker

on:
  workflow_dispatch:
  push:
    branches: [upstream]
    tags: ["release-upstream-**"]

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: golemnetwork/blockscout-optimism

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -Po '(?<=version: ")(.*)(?=")' mix.exs)
          [ -z "$VERSION" ] && echo "Failure to detect version" 2>&1 && exit 1
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image for Optimism (indexer + API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BLOCKSCOUT_VERSION=v${{ steps.version.outputs.version }}
            RELEASE_VERSION=${{ steps.version.outputs.version }}
            CHAIN_TYPE=optimism
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
